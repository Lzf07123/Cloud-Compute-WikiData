name: Deploy Hexo Blog To Dev
on: 
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy Hexo Blog
    runs-on: ubuntu-latest

    steps:
      - name: Update Hexo Blog To Dev
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GZ_DEV_SERVER_HOST }}
          username: ${{ secrets.GZ_SERVER_USERNAME }}
          key: ${{ secrets.GZ_SERVER_KEY }}
          script: |
            cd /opt/cloud-compute-wiki-data
            git pull origin dev
            ls -la
            npx hexo clean
            npx hexo generate
            systemctl restart hexo.service
