name: Deploy Hexo Blog
on: 
  push:
    branches:
      - main

jobs:
  GZ-server:
    name: Test Hexo Blog
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6.0.2
      
      - name: 更新Blog内容
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GZ_SERVER_HOST }}
          username: ${{ secrets.GZ_SERVER_USERNAME }}
          key: ${{ secrets.GZ_SERVER_KEY }}
          script: |
            cd /opt/Cloud-Compute-WikiData
            ls -la
            git pull


        